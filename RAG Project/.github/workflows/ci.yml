name: Multimodal RAG CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-level: '3.11'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr poppler-utils libgl1-mesa-glx

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests
      env:
        ANTHROPIC_API_KEY: "mock_key"
        GROQ_API_KEY: "mock_key"
      run: |
        pytest tests/ -v

    - name: Build Docker Image
      run: |
        docker build -t multimodal-rag-app:latest .

  deploy-to-huggingface:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Install HuggingFace CLI
      run: |
        pip install huggingface_hub

    - name: Deploy to Hugging Face Spaces
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
      run: |
        if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_ID" ]; then
          echo "HF_TOKEN or HF_SPACE_ID is not set. Skipping HF Spaces deploy."
        else
          # Deploying using Hugging Face git CLI sync
          git remote add space https://huggingface.co/spaces/$HF_SPACE_ID
          # Push to Space main branch (using HF_TOKEN for authentication)
          git push --force https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_ID main
        fi
